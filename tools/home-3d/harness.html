<!DOCTYPE html><html><head><meta charset="utf-8"><title>banco prova</title>
<style>html,body{margin:0;height:100%;background:#020302;overflow:hidden}canvas{width:100vw;height:100vh;display:block}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head><body><canvas id="c"></canvas>
<script type="module">
import * as THREE from 'three';
import { createRenderer, createStage } from './stage.js';
const q = new URLSearchParams(location.search);
const name = q.get('asset'), yaw = +(q.get('yaw') || 0.6), pitch = +(q.get('pitch') || 0.25), dist = +(q.get('dist') || 0), fov = +(q.get('fov') || 32);
const canvas = document.getElementById('c');
const renderer = createRenderer(canvas, { mobile: q.get('mobile') === '1' });
renderer.setSize(innerWidth, innerHeight, false);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x020302);
createStage(scene, renderer, { floor: q.get('floor') !== '0' });
const mod = await import('./assets/' + name + '.js?' + Date.now());
const opts = { lod: q.get('lod') || 'high' };
if (q.get('model')) { const { GLTFLoader } = await import('three/addons/loaders/GLTFLoader.js'); opts.model = (await new GLTFLoader().loadAsync(q.get('model') + '?' + Date.now())).scene; }
const obj = mod.build(THREE, opts);
if (q.get('lift')) obj.position.y = +q.get('lift');
scene.add(obj);
const box = new THREE.Box3().setFromObject(obj), size = box.getSize(new THREE.Vector3()), ctr = box.getCenter(new THREE.Vector3());
const R = dist || size.length() * 0.5 / Math.tan(fov * Math.PI / 360) * 1.15;
const cam = new THREE.PerspectiveCamera(fov, innerWidth / innerHeight, 0.01, 200);
cam.position.set(ctr.x + R * Math.sin(yaw) * Math.cos(pitch), ctr.y + R * Math.sin(pitch), ctr.z + R * Math.cos(yaw) * Math.cos(pitch));
cam.lookAt(ctr);
let tris = 0; obj.traverse(o => { if (o.isMesh) { const g = o.geometry; tris += (g.index ? g.index.count : g.attributes.position.count) / 3 * (o.isInstancedMesh ? o.count : 1); } });
let t0 = performance.now();
if (obj.userData.update) obj.userData.update(+(q.get('t') || 0));
renderer.render(scene, cam);
window.__info = { tris: Math.round(tris), size: size.toArray().map(v => +v.toFixed(3)), ms: Math.round(performance.now() - t0) };
window.__ready = true;
</script></body></html>
