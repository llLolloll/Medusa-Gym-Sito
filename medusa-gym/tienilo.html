{n:"Verticale",inst:"Tieni i piedi nel cerchio: si sposta piano",ax:"x",hint:()=>MODE==="tilt"?"↔ Inclina il telefono a destra e a sinistra":FINE?"↔ Trascina col mouse o usa le frecce ← →":"↔ Trascina il dito a destra e a sinistra",
 init(){G.th=(Math.random()<.5?-1:1)*.06;G.w=(Math.random()-.5)*.1;G.ph=Math.random()*6},
 step(dt,t){const tg=.1*Math.sin(t*.6+G.ph)+.04*Math.sin(t*1.7);G.tg=tg;
  const acc=1.8*Math.sin(G.th)+ctrlX()*6.5-2.2*G.w+G.noise*1.6;G.w+=acc*dt;G.th+=G.w*dt;
  G.err=(G.th-tg)/.38;return Math.abs(G.th-tg)>.38||Math.abs(G.th)>.8},
 draw(){const s=sc(),cx=CW/2,fy=CH-36,L=230*s;floorLine(fy);target(cx+Math.sin(G.tg)*L,fy-Math.cos(G.tg)*L,Math.sin(.38)*L);
  X.save();X.translate(cx,fy);X.rotate(G.th);X.scale(s,s);stroke();P([[-22,0],[-14,-62]]);P([[22,0],[14,-62]]);P([[0,-62],[0,-140]]);head(0,-46);P([[0,-140],[-5,-230]]);P([[0,-140],[5,-230]]);X.restore()}},
/* 2. L-SIT: le gambe cedono con la fatica, tocchi per tenerle su (ma non troppo) */
{n:"L-sit",inst:"Tocca per tenere su le gambe, nella fascia verde",ax:"tap",hint:()=>"👆 Niente inclinazione: tocca lo schermo a ritmo",
 init(){G.phi=.05;G.v=0},
 tap(e){G.v-=.6;tone(740,.04,"triangle",.08);vib(6)},
 step(dt,t){const f=.32+t*.035+Math.max(0,Math.sin(t*1.7))*.12;G.v+=(f*2.4-G.v*2.2)*dt;G.phi+=G.v*dt+G.noise*.15*dt;
  G.err=(G.phi-.04)/.24;return G.phi>.42||G.phi<-.36},
 draw(){const s=sc(),cx=CW/2,fy=CH-36;floorLine(fy);
  X.save();X.translate(cx-40*s,fy);X.scale(s,s);
  X.save();X.shadowBlur=0;X.fillStyle="rgba(255,255,255,.18)";X.fillRect(-26,-70,10,70);X.fillRect(18,-70,10,70);X.fillRect(-40,-78,80,8);X.restore();
  stroke();const hip=[18,-104];P([[-4,-78],[-4,-178]]);P([[-4,-178],hip]);head(-8,-202);
  const a=G.phi,knee=[hip[0]+Math.cos(a)*80,hip[1]+Math.sin(a)*80],foot=[hip[0]+Math.cos(a)*165,hip[1]+Math.sin(a)*165];P([hip,knee,foot]);
  X.save();X.shadowBlur=0;X.strokeStyle="rgba(57,255,20,.55)";X.lineWidth=2;X.setLineDash([5,5]);X.beginPath();X.moveTo(hip[0],hip[1]);X.arc(hip[0],hip[1],175,-.2,.28);X.closePath();X.stroke();X.fillStyle="rgba(57,255,20,.08)";X.fill();X.restore();
  X.restore()}},
/* 3. BANDIERA: il corpo è orizzontale sul palo, la gravità lo tira giù sempre */
{n:"Bandiera",inst:"La gravità lo tira giù: tienilo orizzontale",ax:"y",hint:()=>MODE==="tilt"?"↕ Inclina il bordo alto del telefono lontano da te per alzarlo":FINE?"↕ Trascina col mouse in su o usa le frecce ↑ ↓":"↕ Trascina il dito in su per alzarlo, in giù per abbassarlo",
 init(){G.psi=0;G.w=0;G.ph=Math.random()*6},
 step(dt,t){const bias=1.6+.7*Math.sin(t*1.25+G.ph)+.35*Math.sin(t*3.1);G.bias=bias;
  const acc=-bias+ctrlUp()*4.2-2.4*G.w+G.noise*1.5;G.w+=acc*dt;G.psi+=G.w*dt;gust(t,v=>G.w+=v*.7,true);
  G.err=G.psi/.42;return Math.abs(G.psi)>.42},
 draw(){const s=sc(),px=CW/2-110*s,fy=CH-36;floorLine(fy);
  X.save();X.shadowBlur=0;X.fillStyle="rgba(255,255,255,.22)";X.fillRect(px-7,fy-330*s,14,330*s);X.restore();
  X.save();X.translate(px,fy-185*s);X.rotate(-G.psi);X.scale(s,s);
  X.save();X.shadowBlur=0;X.strokeStyle="rgba(57,255,20,.5)";X.lineWidth=2;X.setLineDash([5,5]);P([[20,-30],[250,-30]]);P([[20,30],[250,30]]);X.restore();
  stroke();P([[0,-55],[38,-20]]);P([[0,40],[38,8]]);P([[38,-20],[38,8],[130,0]]);head(28,-34);P([[130,0],[235,-6]]);P([[130,0],[235,8]]);X.restore()}},
/* 4. PLANCHE: equilibrio avanti/indietro, il bersaglio si muove */
{n:"Planche",inst:"Tieni le spalle sul bersaglio: si sposta",ax:"x",hint:()=>MODE==="tilt"?"↔ Inclina il telefono a destra e a sinistra":FINE?"↔ Trascina col mouse o usa le frecce ← →":"↔ Trascina il dito a destra e a sinistra",
 init(){G.th=(Math.random()<.5?-1:1)*.03;G.w=0;G.ph=Math.random()*6},
 step(dt,t){const tg=.14*Math.sin(t*1.1+G.ph);G.tg=tg;
  const acc=2.8*Math.sin(G.th)+ctrlX()*7.5-2*G.w+G.noise*2.2;G.w+=acc*dt;G.th+=G.w*dt;gust(t,v=>G.w+=v);
  G.err=(G.th-tg)/.26;return Math.abs(G.th-tg)>.26||Math.abs(G.th)>.7},
 draw(){const s=sc(),cx=CW/2,fy=CH-60;floorLine(fy+24*s);
  const sx=cx+Math.sin(G.tg)*120*s;target(sx,fy-70*s,26*s);
  X.save();X.translate(cx,fy);X.scale(s,s);stroke();
  const sh=[Math.sin(G.th)*120,-70];P([[-8,24],[sh[0]*.4,-25],sh]);P([[8,24],[sh[0]*.4+6,-25],[sh[0]+6,-70]]);
  head(sh[0]+22,-80);P([sh,[sh[0]-150,-64-Math.sin(G.th)*30]]);P([[sh[0]-150,-64-Math.sin(G.th)*30],[sh[0]-230,-60-Math.sin(G.th)*50]]);X.restore()}}
];
/* pad del comando: mostra in tempo reale cosa stai facendo e in che direzione */
function drawPad(sk,t){X.save();X.shadowBlur=0;const r=30,x=CW-r-12,y=r+12;
  X.fillStyle="rgba(255,255,255,.06)";X.strokeStyle="rgba(255,255,255,.2)";X.lineWidth=1.5;X.beginPath();X.arc(x,y,r,0,7);X.fill();X.stroke();
  if(sk.ax==="tap"){const p=.5+.5*Math.sin(t*9);X.fillStyle=`rgba(57,255,20,${.35+p*.5})`;X.font="700 12px Archivo,system-ui";X.textAlign="center";X.fillText("TOCCA",x,y+4);
    X.font="400 34px 'Bebas Neue',Impact";X.fillStyle=`rgba(57,255,20,${.15+p*.25})`;X.fillText("TOCCA!",CW/2,CH*.18);X.restore();return}
  const v=sk.ax==="x"?ctrlX():ctrlUp(),dx=sk.ax==="x"?v*r*.75:0,dy=sk.ax==="y"?-v*r*.75:0;
  X.strokeStyle="rgba(57,255,20,.4)";X.beginPath();if(sk.ax==="x"){X.moveTo(x-r+6,y);X.lineTo(x+r-6,y)}else{X.moveTo(x,y-r+6);X.lineTo(x,y+r-6)}X.stroke();
  X.fillStyle="#39FF14";X.shadowColor="#39FF14";X.shadowBlur=10;X.beginPath();X.arc(x+dx,y+dy,7,0,7);X.fill();
  X.font="700 10px Archivo,system-ui";X.textAlign="center";X.shadowBlur=0;X.fillStyle="rgba(255,255,255,.6)";X.fillText(sk.ax==="x"?"↔":"↕",x,y+r+12);X.restore()}
/* finale: muscle-up a tempo */
const MU={n:"Muscle-up",inst:"Tocca nel verde per salire sopra la sbarra",hint:()=>"3 tentativi: ogni muscle-up vale 5 secondi di bonus"};
/* spinte improvvise con avviso */
function gust(t,apply,down){if(t<G.nextGust)return;if(!G.gw){G.gw={dir:down?-1:(Math.random()<.5?-1:1),at:t+.7};
  const w=document.createElement("div");w.className="warn";w.style.animationDuration=".85s";w.textContent=G.gw.dir<0?(down?"↓ SPINTA":"← SPINTA"):"SPINTA →";w.style.left=G.gw.dir<0?"14%":"auto";w.style.right=G.gw.dir>0?"14%":"auto";document.body.appendChild(w);setTimeout(()=>w.remove(),850);tone(330,.12,"sawtooth",.08)}
  else if(t>=G.gw.at){apply(G.gw.dir*.6*(1+G.k*.15));G.gw=null;G.nextGust=t+2.2+Math.random()*1.8-G.k*.2}}
/* ---------- flusso ---------- */
async function calibrate(){
  if(MODE==="tilt"&&typeof DeviceOrientationEvent!=="undefined"&&typeof DeviceOrientationEvent.requestPermission==="function"){
    try{const r=await DeviceOrientationEvent.requestPermission();if(r!=="granted")MODE="dito"}catch(e){MODE="dito"}}
  if(MODE==="tilt"){await splash("Tieni il telefono","comodo davanti a te",1000);await sleep(250);
    if(!gotTilt){MODE="dito";await splash("Uso il dito","il telefono non manda l'inclinazione",1300)}
    else{let a=0,b=0,n=0;const t0=performance.now();while(performance.now()-t0<500){a+=gRaw;b+=bRaw;n++;await sleep(25)}g0=a/n;b0=b/n}}}
function setSkill(k){G.k=k;const s=SK[k];$("skn").textContent="ESERCIZIO "+(k+1)+"/4";$("lvname").textContent=s.n;$("inst").textContent=s.inst;$("hint").textContent=s.hint();
  document.querySelectorAll(".skbar i").forEach((e,i)=>e.classList.toggle("done",i<k));G.nextGust=1.6+Math.random();G.gw=null;G.noise=0;G.err=0;s.init()}
async function start(){G={t:0,k:0,state:"wait",noise:0,total:0,mu:0};$("sec").textContent="0,0";fitC();X.clearRect(0,0,CW,CH);
  await calibrate();
  const da=Math.max(0,Math.min(3,(+new URLSearchParams(location.search).get("da")||1)-1));G.da=da;
  for(let k=da;k<SK.length;k++){
    setSkill(k);X.clearRect(0,0,CW,CH);SK[k].draw();
    await splash(SK[k].n,SK[k].hint(),1900);
    tone(1046,.15,"triangle",.18);if(k===0)trk("tienilo_start",{modo:MODE});
    const ok=await run(k);if(!ok)return fall();
    G.total+=SKDUR;$("sr").textContent=SK[k].n+" completato";perfect();vib([15,30,15]);spark(innerWidth/2,innerHeight*.35,50)}
  document.querySelectorAll(".skbar i").forEach((e,i)=>e.classList.toggle("done",i<4));
  await muscleUp();document.querySelectorAll(".skbar i").forEach(e=>e.classList.add("done"));end(true)}
function run(k){return new Promise(res=>{G.state="play";let t=0,last=performance.now();const bar=document.querySelectorAll(".skbar i b")[k];
  const f=now=>{if(G.state!=="play")return;const dt=Math.min(.04,(now-last)/1000);last=now;t+=dt;
    G.noise+=(Math.random()-.5)*(1+k*.25+t*.05)*dt*6;G.noise*=Math.pow(.2,dt);
    const lost=SK[k].step(dt,t);$("sec").textContent=(G.total+t).toFixed(1).replace(".",",");bar.style.width=(t/SKDUR*100)+"%";
    $("mi").style.left=(50+cl(G.err)*48)+"%";X.clearRect(0,0,CW,CH);SK[k].draw();drawPad(SK[k],t);
    if(lost){G.state="wait";G.part=t;res(false);return}
    if(t>=SKDUR){G.state="wait";bar.style.width="";res(true);return}requestAnimationFrame(f)};requestAnimationFrame(f)})}
async function muscleUp(){$("skn").textContent="FINALE";$("lvname").textContent=MU.n;$("inst").textContent=MU.inst;$("hint").textContent=MU.hint();
  await punch("Finale:<br><b>muscle-up!</b>");
  for(let i=0;i<3;i++){let z0=.62+Math.random()*.2-i*.02,w=.2-i*.04,per=1200-i*150,done=false,hit=false,t0=performance.now(),up=0,fin=false;
    await new Promise(res=>{const tap=()=>{if(done)return;done=true;const v=G.v;hit=v>=z0&&v<=z0+w;if(hit){perfect();vib(20);G.mu++;up=performance.now()}else{miss();vib([30,30])}setTimeout(()=>{fin=true;res()},hit?800:600)};
      const on=e=>{e.preventDefault&&e.preventDefault();tap()};C.addEventListener("pointerdown",on);const kd=e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();tap()}};addEventListener("keydown",kd);
      const f=now=>{if(!document.hidden){vis+=Math.min(100,now-lastF)}lastF=now;if(!done&&vis>per*2){done=true;miss();fbAuto()}const v=(Math.sin((now-t0)/per*6.283-1.57)+1)/2;if(!done)G.v=v;drawMU(done?G.v:v,z0,w,hit,up?Math.min(1,(now-up)/500):0,i);
        if(!fin)requestAnimationFrame(f)};
      let vis=0,lastF=performance.now();function fbAuto(){setTimeout(()=>{fin=true;res()},600)}
      requestAnimationFrame(f);G._clean=()=>{C.removeEventListener("pointerdown",on);removeEventListener("keydown",kd)}});
    G._clean();if(hit){$("sec").textContent=(G.total+G.mu*5).toFixed(1).replace(".",",");spark(innerWidth/2,innerHeight*.35,40)}}}
function drawMU(v,z0,w,hit,k,i){const s=sc(),cx=CW/2,by=CH*.32;X.clearRect(0,0,CW,CH);
  X.save();X.shadowBlur=0;X.fillStyle="rgba(255,255,255,.3)";X.fillRect(cx-120*s,by-5,240*s,10);
  const bx=cx+130*s,bt=by,bh=CH*.5;X.fillStyle="rgba(255,255,255,.08)";X.fillRect(bx,bt,22,bh);X.fillStyle="rgba(57,255,20,.45)";X.fillRect(bx,bt+bh*(1-z0-w),22,bh*w);
  X.fillStyle="#fff";X.fillRect(bx-6,bt+bh*(1-v)-4,34,8);
  X.restore();
  X.save();X.translate(cx,by);X.scale(s,s);stroke();const lift=hit?k*120:v*40;
  if(lift<70){const o=lift;P([[-22,0],[-12,58-o]]);P([[22,0],[12,58-o]]);head(0,36-o*.6);P([[0,58-o],[0,150-o]]);P([[0,150-o],[-6,240-o]]);P([[0,150-o],[6,240-o]])}
  else{P([[-20,0],[-18,-40],[0,-60]]);P([[20,0],[18,-40],[0,-60]]);head(0,-76);P([[0,-60],[0,30]]);P([[0,30],[-6,120]]);P([[0,30],[6,120]])}
  X.restore();
  X.save();X.shadowBlur=0;X.fillStyle="rgba(255,255,255,.6)";X.font="700 13px Archivo,system-ui";X.textAlign="center";X.fillText("Tentativo "+(i+1)+" di 3",cx,CH-14);X.restore()}
async function fall(){try{$("sr").textContent="Caduto"}catch(e){}tone(220,.3,"sawtooth",.14,80);vib([60,40,80]);await splash("Giù!","",900);G.total+=G.part||0;end(false)}
function level(s){return s>=50?["Leggenda della sbarra","Tutti e quattro gli esercizi e i muscle-up: vieni a mostrarlo a Yvonne."]:s>=35?["Corpo libero vero","Controllo e forza: in sala con la calisthenics completi il giro."]:s>=18?["In equilibrio","Buona base. Le skill vere si costruiscono con le progressioni giuste."]:["Principiante","Tutti partono da qui. La prima lezione di Calisthenics è gratis."]}
function end(full){const bonus=G.mu*5,tot=+(G.total+bonus).toFixed(1),[lv,txt]=level(tot);
  trk("tienilo_end",{secondi:tot,livello:lv,modo:MODE,esercizi:full?4:G.k,muscleup:G.mu});
  const s=tot.toFixed(1).replace(".",","),names=["verticale","L-sit","bandiera","planche"];
  const msg=`Ciao Medusa! Ho fatto ${s} secondi a "Tienilo" sul vostro sito (livello: ${lv}). Voglio provare la calisthenics dal vivo: posso prenotare la prova gratuita?`;
  $("scr").innerHTML=`<div class="card"><div class="eyebrow">${full?(G.da?"FINO IN FONDO DA "+names[G.da].toUpperCase():"GIRO COMPLETO"):"CADUTO IN "+names[G.k].toUpperCase()}</div><div class="big final" id="fin">0</div><div class="unit">secondi</div><div class="lvl">${lv}</div><p>${txt}</p>
    <div class="break"><div><b>${(full?4:G.k)-(G.da||0)}/${4-(G.da||0)}</b>esercizi</div><div><b>${G.mu}/3</b>muscle-up</div><div><b>+${bonus}</b>bonus</div></div>
    <a class="btn" id="cta" target="_blank" rel="noopener" href="https://wa.me/${WA}?text=${encodeURIComponent(msg)}">Provala dal vivo</a>
    <button class="ghost" id="share">Sfida un amico</button><button class="ghost" id="again">Riprova</button><a class="back" href="/">&#8592; Torna al sito di Medusa Gym</a></div>`;
  countUp($("fin"),tot,1);setTimeout(()=>spark(W/2,H*.3,full?90:40),400);
  $("cta").addEventListener("click",()=>{try{if(typeof fbq==="function")fbq("track","Contact")}catch(e){}});
  shareBtn($("share"),`Ho fatto ${s} secondi a Tienilo di Medusa Gym (${lv}). Riesci a battermi?`,GAME.url);
  $("again").onclick=()=>{$("scr").innerHTML="";start()}}
function intro(){$("scr").innerHTML=`<div class="card"><a class="logo" href="/" aria-label="Medusa Gym, torna alla home"><img src="/logo-b.webp" alt="Medusa Gym Fight n' Fitness" width="480" height="191"></a><div class="eyebrow">IL GIOCO DI MEDUSA GYM</div><h1>Tienilo</h1>
  <p>Quattro skill di calisthenics, 10 secondi ciascuna. Se cadi, è finita. Funziona come una pallina sul telefono: inclini dalla parte dove vuoi spostarlo.</p>
  <div class="mode" role="group" aria-label="Come vuoi giocare"><button type="button" data-m="tilt" aria-pressed="${MODE==="tilt"}">Inclina il telefono</button><button type="button" data-m="dito" aria-pressed="${MODE==="dito"}">Usa il dito</button></div>
  <div class="rules"><div><b>Verticale</b> ↔ inclina a destra e a sinistra</div>
  <div><b>L-sit</b> 👆 tocca a ritmo per tenere su le gambe</div>
  <div><b>Bandiera</b> ↕ inclina avanti e indietro: la gravità tira giù</div>
  <div><b>Planche</b> ↔ inclina a destra e a sinistra</div><div><b>Occhio alle spinte</b> dalla bandiera in poi arrivano spinte improvvise</div>
  <div><b>Finale</b> 3 muscle-up a tempo: 5 secondi di bonus ciascuno</div></div>
  <button class="btn" id="go">Inizia</button>
  <p class="note">Con "Inclina il telefono" blocca la rotazione dello schermo. Su iPhone ti verrà chiesto di consentire l'accesso al movimento.</p>
  <a class="back" href="/">&#8592; Torna al sito di Medusa Gym</a></div>`;
  $("scr").querySelectorAll(".mode button").forEach(b=>b.onclick=()=>{MODE=b.dataset.m;$("scr").querySelectorAll(".mode button").forEach(x=>x.setAttribute("aria-pressed",x===b))});
  $("go").onclick=()=>{ac();$("scr").innerHTML="";start()}}
let G={k:0,state:"wait",noise:0};fitC();intro();
</script>
