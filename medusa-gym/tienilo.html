    if(!gotTilt){MODE="dito";await splash("Uso il dito","il telefono non manda l'inclinazione",1300)}else{let s=0,n=0;const t0=performance.now();while(performance.now()-t0<500){s+=tiltRaw;n++;await sleep(25)}tiltBase=s/n}}
  $("hint").textContent=MODE==="tilt"?"Se cade da una parte, inclina il telefono dalla parte opposta":"Se cade da una parte, trascina il dito dalla parte opposta";}
async function start(){G={th:(Math.random()<.5?-1:1)*.02,w:0,t:0,lv:0,lim:.55,state:"wait",fz:0,noise:0};$("sec").textContent="0,0";fitC();drawMan(G.th,0);
  await calibrate();
  for(const n of ["3","2","1"]){await splash(n,"",600);tone(660,.1,"square",.1)}
  await splash("Tienilo!","",600);tone(1046,.15,"triangle",.18);trk("tienilo_start",{modo:MODE});
  G.state="play";G.last=performance.now();setLevel(0);requestAnimationFrame(step)}
function setLevel(i){G.lv=i;const L=LV[i];$("lvn").textContent="LIVELLO "+(i+1);$("lvname").textContent=L.n;G.lim=[.55,.5,.44,.44,.4][i];
  document.body.classList.toggle("freeze",!!L.freeze);
  $("inst").textContent=L.freeze?"Resta immobile al centro per 5 secondi: bonus!":i===0?"Tienilo dentro il cerchio":i===1?"Le gambe aperte lo rendono più instabile":i===2?"Un braccio solo: equilibrio fine":"Fin dove arrivi?";
  if(i>0){tone(1318,.12,"triangle",.16);setTimeout(()=>tone(1760,.14,"triangle",.14),90);vib([20,40,20]);
    $("ov").innerHTML=`<div class="splash"><div class="big" style="font-size:clamp(36px,10vw,60px)">${L.freeze?"Freeze!":L.n}</div></div>`;setTimeout(()=>$("ov").innerHTML="",900)}}
function step(t){if(G.state!=="play")return;let dt=Math.min(.04,(t-G.last)/1000);G.last=t;G.t+=dt;
  const L=LV[G.lv];
  // rumore lento (tremore del corpo) + piccole spinte
  G.noise+= (Math.random()-.5)*L.noise*dt*6;G.noise*=Math.pow(.2,dt);
  const c=control();
  const acc=L.G*Math.sin(G.th)+c*7.5-2*G.w+G.noise*2.2;
  G.w+=acc*dt;G.th+=G.w*dt;
  if(L.freeze){if(Math.abs(G.th)<.12&&Math.abs(G.w)<.5)G.fz+=dt}
  const nx=LV.findIndex((l,i)=>i>G.lv&&G.t>=l.t);if(nx>0)setLevel(nx);
  $("sec").textContent=G.t.toFixed(1).replace(".",",");
  drawMan(G.th,G.lv,!!L.freeze);hudMeter(G.th);
  if(Math.abs(G.th)>G.lim){fall();return}
  requestAnimationFrame(step)}
async function fall(){G.state="wait";tone(220,.3,"sawtooth",.14,80);vib([60,40,80]);
  // caduta animata
  const dir=Math.sign(G.th),t0=performance.now();await new Promise(r=>{const a=t=>{const k=Math.min(1,(t-t0)/450);drawMan(G.th+dir*k*1.2,G.lv,false);if(k<1)requestAnimationFrame(a);else r()};requestAnimationFrame(a)});
  const r=C.getBoundingClientRect();spark(r.left+r.width/2+dir*80,r.bottom-40,40,"255,180,90");
  await splash("Giù!","",800);end()}
function level(s){return s>=35?["Leggenda della verticale","Equilibrio da atleta. Vieni a mostrarlo a Yvonne."]:s>=20?["Corpo libero vero","Controllo e calma: in sala con la calisthenics arrivi alla verticale vera."]:s>=10?["In equilibrio","Buon controllo. La verticale vera si costruisce con le progressioni giuste."]:["Principiante","Tutti partono da qui. La prima lezione di Calisthenics è gratis."]}
function end(){const bonus=Math.min(10,Math.round(G.fz*2)),tot=+(G.t+bonus).toFixed(1),[lv,txt]=level(tot);
  trk("tienilo_end",{secondi:tot,livello:lv,modo:MODE,bonus});
  const s=tot.toFixed(1).replace(".",",");
  const msg=`Ciao Medusa! Ho tenuto la verticale ${s} secondi a "Tienilo" sul vostro sito (livello: ${lv}). Voglio provarla dal vivo: posso prenotare la prova gratuita di Calisthenics?`;
  $("scr").innerHTML=`<div class="card"><div class="eyebrow">VERTICALE TENUTA</div><div class="big final" id="fin">0</div><div class="unit">secondi</div><div class="lvl">${lv}</div><p>${txt}</p>
    <div class="break"><div><b>${G.t.toFixed(1).replace(".",",")}</b>in equilibrio</div><div><b>+${bonus}</b>bonus freeze</div><div><b>${G.lv+1}</b>livello</div></div>
    <a class="btn" id="cta" target="_blank" rel="noopener" href="https://wa.me/${WA}?text=${encodeURIComponent(msg)}">Provala dal vivo</a>
    <button class="ghost" id="share">Sfida un amico</button><button class="ghost" id="again">Riprova</button><a class="back" href="/">&#8592; Torna al sito di Medusa Gym</a></div>`;
  countUp($("fin"),tot,1);setTimeout(()=>spark(W/2,H*.3,tot>=20?90:40),400);
  $("cta").addEventListener("click",()=>{try{if(typeof fbq==="function")fbq("track","Contact")}catch(e){}});
  shareBtn($("share"),`Ho tenuto la verticale ${s} secondi a Tienilo di Medusa Gym (${lv}). Riesci a battermi?`,GAME.url);
  $("again").onclick=()=>{$("scr").innerHTML="";start()}}
function intro(){$("scr").innerHTML=`<div class="card"><a class="logo" href="/" aria-label="Medusa Gym, torna alla home"><img src="/logo-b.webp" alt="Medusa Gym Fight n' Fitness" width="480" height="191"></a><div class="eyebrow">IL GIOCO DI MEDUSA GYM</div><h1>Tienilo</h1>
  <p>La verticale è controllo, non forza. Quanto riesci a tenerla?</p>
  <div class="mode" role="group" aria-label="Come vuoi giocare"><button type="button" data-m="tilt" aria-pressed="${MODE==="tilt"}">Inclina il telefono</button><button type="button" data-m="dito" aria-pressed="${MODE==="dito"}">Usa il dito</button></div>
  <div class="rules"><div><b>Tienilo in equilibrio</b> se cade a destra, inclina (o trascina) a sinistra, e viceversa</div>
  <div><b>Ogni 10 secondi si sale</b> gambe aperte, poi su un braccio: sempre più instabile</div>
  <div><b>Freeze</b> a 30 secondi resta immobile al centro per il bonus</div></div>
  <button class="btn" id="go">Sali in verticale</button>
  <p class="note">Su iPhone, con "Inclina il telefono", ti verrà chiesto di consentire l'accesso al movimento.</p>
  <a class="back" href="/">&#8592; Torna al sito di Medusa Gym</a></div>`;
  $("scr").querySelectorAll(".mode button").forEach(b=>b.onclick=()=>{MODE=b.dataset.m;$("scr").querySelectorAll(".mode button").forEach(x=>x.setAttribute("aria-pressed",x===b))});
  $("go").onclick=()=>{ac();$("scr").innerHTML="";start()}}
fitC();G={th:0,lim:.55,lv:0};drawMan(0,0);intro();
</script>
</body>
</html>
