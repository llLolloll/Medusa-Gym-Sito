    if(side<.5){x=Math.random()*W;y=H+10;vx=(Math.random()-.5)*1.2;vy=-(2.5+Math.random()*3.5)*(0.8+fireLvl*.6)}
    else if(side<.75){x=-10+Math.random()*20;y=Math.random()*H;vx=.3+Math.random()*.6;vy=-(1.5+Math.random()*2.5)}
    else{x=W+10-Math.random()*20;y=Math.random()*H;vx=-(.3+Math.random()*.6);vy=-(1.5+Math.random()*2.5)}
    F.push({x,y,vx,vy,l:1,d:.012+Math.random()*.02,s:12+Math.random()*(18+fireLvl*26)})
  }
}
function spark(x,y,n,col){wake();for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=2+Math.random()*7;SP.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-2,l:1,s:1.5+Math.random()*2.5,c:col||"57,255,20"})}}
function frame(t){
  const dt=t-last;last=t;if(dt>28)budget=Math.max(.35,budget-.05);else if(dt<20)budget=Math.min(1,budget+.01);
  cx.clearRect(0,0,W,H);
  if(fireOn)spawnFire();
  cx.globalCompositeOperation="lighter";
  F=F.filter(p=>p.l>0);
  for(const p of F){p.x+=p.vx+Math.sin(t/120+p.y/40)*.6;p.y+=p.vy;p.l-=p.d;p.s*=.985;
    const k=p.l;let col;
    if(green)col=k>.7?`rgba(230,255,235,${k*.55})`:k>.4?`rgba(57,255,20,${k*.5})`:`rgba(10,140,60,${k*.55})`;
    else col=k>.75?`rgba(255,250,220,${k*.6})`:k>.5?`rgba(255,190,60,${k*.55})`:k>.25?`rgba(255,100,30,${k*.45})`:`rgba(170,30,10,${k*.35})`;
    const g=cx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.s);g.addColorStop(0,col);g.addColorStop(1,"rgba(0,0,0,0)");
    cx.fillStyle=g;cx.beginPath();cx.arc(p.x,p.y,p.s,0,7);cx.fill()}
  SP=SP.filter(p=>p.l>0);
  for(const p of SP){p.x+=p.vx;p.y+=p.vy;p.vy+=.2;p.vx*=.98;p.l-=.022;cx.fillStyle=`rgba(${p.c},${p.l})`;cx.beginPath();cx.arc(p.x,p.y,p.s*p.l+.5,0,7);cx.fill()}
  cx.globalCompositeOperation="source-over";
  if(fireOn||F.length||SP.length)requestAnimationFrame(frame);else{running=false;cx.clearRect(0,0,W,H)}}
let running=false;function wake(){if(!running){running=true;last=performance.now();requestAnimationFrame(frame)}}

/* ---------------- gioco ---------------- */
const ROUNDS=[{len:2,pool:["1","2","3","4"],n:5,time:3000},{len:3,pool:["1","2","3","4","5","6"],n:5,time:3300},{len:4,pool:["1","2","3","4","5","6","K"],n:5,time:3800}];
let G={};
const bag=$("bag"),bw=$("bagwrap"),kick=$("kick");
function reset(){G={r:0,c:0,score:0,combo:0,lives:3,state:"idle",seq:[],pos:0,t0:0,dur:0,okC:0,best:0,hits:0,mult:1,comboPts:0};
  $("score").textContent=0;$("rnd").textContent=1;[...$("lives").children].forEach(s=>s.classList.remove("off"));$("seq").innerHTML="";$("streak").textContent="";$("tbar").style.width="100%"}
function splash(big,sub,ms=1100){return new Promise(r=>{$("ov").innerHTML=`<div class="splash"><div class="big">${big}</div>${sub?`<p>${sub}</p>`:""}</div>`;setTimeout(()=>{$("ov").innerHTML="";r()},ms)})}
const pick=a=>a[Math.floor(Math.random()*a.length)];
function makeCombo(R){const s=[];while(s.length<R.len){const v=pick(R.pool);if(s.length&&s.at(-1)===v)continue;s.push(v)}
  if(R.pool.includes("K")&&!s.includes("K"))s[s.length-1]="K";return s}
async function startRound(){
  const R=ROUNDS[G.r];$("rnd").textContent=G.r+1;kick.hidden=!R.pool.includes("K");
  await splash(`Round ${G.r+1}`,["Combo da 2 colpi","Combo da 3 colpi, più veloce","Combo da 4, calci compresi"][G.r]);
  await splash("Fight!","",650);G.c=0;nextCombo()}
function nextCombo(){
  const R=ROUNDS[G.r];
  if(G.c>=R.n){G.r++;if(G.r>=ROUNDS.length)return fireFinal();return startRound()}
  G.seq=makeCombo(R);G.pos=0;G.dur=R.time-G.c*120;G.t0=performance.now();G.state="combo";
  $("coach").textContent="IL COACH CHIAMA";
  $("seq").innerHTML=G.seq.map(v=>`<b class="${v==="K"?"k":""}">${v==="K"?"CALCIO":v}</b>`).join("");
  hintNext();tick()}
function hintNext(){document.querySelectorAll(".z").forEach(z=>z.classList.toggle("hint",z.dataset.z===G.seq[G.pos]&&G.r===0))}
function tick(){if(G.state!=="combo")return;const k=1-(performance.now()-G.t0)/G.dur;$("tbar").style.width=Math.max(0,k*100)+"%";
  if(k<=0)return fail("Tempo scaduto");requestAnimationFrame(tick)}
function fail(why){
  G.state="wait";G.combo=0;G.lives--;buzz();vib([40,40,40]);
  const b=$("seq").children[G.pos];if(b)b.classList.add("bad");
  [...$("lives").children].forEach((s,i)=>s.classList.toggle("off",i>=G.lives));$("streak").textContent=why;
  if(G.lives<=0)return setTimeout(async()=>{await splash("KO!","Il sacco ha vinto questa volta",1300);end(true)},450);
  G.c++;setTimeout(nextCombo,750)}
function hit(z,el,e){
  const r=(el||bag).getBoundingClientRect();const x=e&&e.clientX?e.clientX:r.left+r.width/2,y=e&&e.clientY?e.clientY:r.top+r.height/2;
  if(G.state==="fire"){G.hits++;thump(.7+Math.random()*.4,Math.random()<.5);vib(8);spark(x,y,14,G.mult>=3?"57,255,20":"255,190,80");shake();updateFire();return}
  if(G.state!=="combo")return;
  el.classList.add("flash");setTimeout(()=>el.classList.remove("flash"),120);
  if(z!==G.seq[G.pos]){el.classList.add("err");setTimeout(()=>el.classList.remove("err"),250);return fail("Colpo sbagliato")}
  thump(1,z==="K");vib(15);spark(x,y,10);shake();
  $("seq").children[G.pos].classList.add("done");G.pos++;hintNext();
  if(G.pos>=G.seq.length){
    G.state="wait";const left=Math.max(0,1-(performance.now()-G.t0)/G.dur);G.combo++;G.best=Math.max(G.best,G.combo);G.okC++;
    const pts=Math.round((100*G.seq.length+left*100*G.seq.length)*(1+(G.combo-1)*.1));G.score+=pts;G.comboPts=G.score;
    $("score").textContent=G.score;$("streak").textContent=G.combo>1?`+${pts}  ·  ${G.combo} combo di fila!`:`+${pts}`;
    $("coach").textContent=pick(["BRAVO!","COSÌ!","OTTIMO!","PULITO!"]);
    G.c++;setTimeout(nextCombo,550)}}
function shake(){bw.style.setProperty("--rot",(Math.random()<.5?-1:1)*(2+Math.random()*2.5)+"deg");bw.classList.add("hit");clearTimeout(shake.t);shake.t=setTimeout(()=>bw.classList.remove("hit"),110)}
document.querySelectorAll(".z").forEach(z=>z.addEventListener("pointerdown",e=>{e.preventDefault();hit(z.dataset.z,z,e)}));
kick.addEventListener("pointerdown",e=>{e.preventDefault();hit("K",kick,e)});
/* tastiera: tasti 1-6 e K (o spazio nel finale) */
addEventListener("keydown",e=>{if(e.repeat)return;const k=e.key.toUpperCase();const el=k==="K"?kick:document.querySelector('.z[data-z="'+k+'"]');if(el){e.preventDefault();hit(k,el,null)}else if(k===" "&&G.state==="fire"){e.preventDefault();hit("1",document.querySelector(".z"),null)}});

/* ---------------- finale di fuoco ---------------- */
async function fireFinal(){
  G.state="wait";kick.hidden=true;$("seq").innerHTML="";$("streak").textContent="";$("coach").textContent="";$("tbar").style.width="0";
  document.querySelectorAll(".z").forEach(z=>z.classList.remove("hint"));
  fireLvl=.15;green=false;fireOn=true;setGlow();wake();
  await splash("10 secondi<br>di fuoco!","Colpisci il sacco più che puoi",1500);
  G.state="fire";G.hits=0;G.mult=1;
  const hud=document.createElement("div");hud.className="firehud";hud.id="fhud";
  hud.innerHTML=`<div class="big t" id="fsec">10</div><div class="big m" id="fm">x1.0</div><div class="c" id="fc">0 colpi</div>`;document.body.appendChild(hud);
  const t0=performance.now();
  const loop=()=>{const s=10-(performance.now()-t0)/1000;$("fsec").textContent=Math.max(0,Math.ceil(s));
    if(s<=0){G.state="wait";fireOn=false;setGlow();hud.remove();return setTimeout(()=>end(false),700)}requestAnimationFrame(loop)};loop()}
function setGlow(){const g=$("glow");g.classList.toggle("on",fireOn);g.style.setProperty("--gs",(30+fireLvl*55)+"px");g.style.setProperty("--gc",green?"rgba(57,255,20,.55)":"rgba(255,120,30,.6)");g.style.setProperty("--gc2",green?"rgba(20,200,90,.35)":"rgba(255,60,10,.4)")}
function updateFire(){if(!$("fm"))return;
  G.mult=Math.min(3,1+G.hits/25);fireLvl=.15+(G.mult-1)*.6;
  if(G.mult>=3&&!green){green=true;spark(W/2,H/2,120,"57,255,20");vib([60,30,60])}
  setGlow();$("fm").textContent="x"+G.mult.toFixed(1);$("fm").style.transform="scale(1.15)";setTimeout(()=>{const f=$("fm");if(f)f.style.transform=""},80);
  $("fm").style.color=green?"var(--green)":G.mult>2?"#ffd27a":"#ff9a4d";$("fc").textContent=G.hits+" colpi"}

/* ---------------- schermate ---------------- */
function level(s){return s>=25000?["Materiale da Last Round","Hai il ritmo di chi sale sul ring. Vieni a farti vedere dal Maestro."]:s>=12000?["Amatore di livello","Mani veloci e testa lucida. Con qualche allenamento vero voli."]:s>=5000?["Amatore","Le basi ci sono. Sul sacco vero, con un coach accanto, è un'altra storia."]:["Principiante","Tutti partono da qui. La prima lezione è gratis."]}
function end(ko){
  const final=ko?G.score:Math.round(G.score*G.mult);const [lv,txt]=level(final);
  trk("game_end",{punteggio:final,livello:lv,ko:ko?"si":"no",moltiplicatore:ko?1:+G.mult.toFixed(1)});
  const msg=`Ciao Medusa! Ho fatto ${final} punti a "Sfida il sacco" sul vostro sito (livello: ${lv}). Voglio provarlo sul sacco vero: posso prenotare la prova gratuita?`;
  $("scr").innerHTML=`<div class="card"><div class="eyebrow">${ko?"KO TECNICO":"FINE DEL MATCH"}</div>
    <div class="big final" id="fin">0</div><div class="lvl">${lv}</div><p>${txt}</p>
    <div class="break"><div><b>${G.score}</b>punti combo</div><div><b>x${ko?"1.0":G.mult.toFixed(1)}</b>fuoco</div><div><b>${G.best}</b>combo di fila</div></div>
    <a class="btn" id="cta" target="_blank" rel="noopener" href="https://wa.me/${WA}?text=${encodeURIComponent(msg)}">Provalo sul sacco vero</a>
    <button class="ghost" id="share">Sfida un amico</button>
    <button class="ghost" id="again">Rigioca</button><a class="back" href="/">&#8592; Torna al sito di Medusa Gym</a></div>`;
  const el=$("fin"),t0=performance.now();const tk=t=>{const k=Math.min(1,(t-t0)/1200);el.textContent=Math.round(final*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(tk)};requestAnimationFrame(tk);
  setTimeout(()=>spark(W/2,H*.3,ko?30:90),400);
  $("cta").addEventListener("click",()=>{try{if(typeof fbq==="function")fbq("track","Contact")}catch(e){}});
  $("again").onclick=()=>{$("scr").innerHTML="";green=false;fireLvl=0;start()};
  const shareTxt=`Ho fatto ${final} punti a Sfida il sacco di Medusa Gym (${lv}). Riesci a battermi?`,shareUrl="https://www.medusagym.it/sfida-il-sacco.html";
  $("share").onclick=async()=>{trk("game_share");
    // 1) condivisione nativa del telefono, se il browser la permette
    if(navigator.share){try{await navigator.share({title:"Sfida il sacco",text:shareTxt,url:shareUrl});return}catch(e){if(e&&e.name==="AbortError")return}}
    // 2) altrimenti mini menu con WhatsApp e copia link
    $("share").outerHTML=`<div class="shr"><a class="ghost" target="_blank" href="https://wa.me/?text=${encodeURIComponent(shareTxt+" "+shareUrl)}">Invia su WhatsApp</a><button class="ghost" id="copy">Copia il link</button></div>`;
    $("copy").onclick=()=>{const t=shareTxt+" "+shareUrl;const ok=()=>$("copy").textContent="Link copiato!";
      const legacy=()=>{const ta=document.createElement("textarea");ta.value=t;ta.style.cssText="position:fixed;opacity:0";document.body.appendChild(ta);ta.select();try{document.execCommand("copy");ok()}catch(e){$("copy").textContent="Tieni premuto per copiare"}ta.remove()};
      if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(ok,legacy);else legacy()};
  };
}
function intro(){
  $("scr").innerHTML=`<div class="card"><a class="logo" href="/" aria-label="Medusa Gym, torna alla home"><img src="logo-b.webp" alt="Medusa Gym Fight n' Fitness" width="480" height="191"></a><div class="eyebrow">IL GIOCO DI MEDUSA GYM</div><h1>Sfida<br>il sacco</h1>
    <p>Il coach chiama le combo, tu colpisci. Quanto sei veloce?</p>
    <div class="rules"><div><b>1-2-3-4-5-6</b> jab, diretto, ganci e montanti: tocca le zone del sacco nell'ordine giusto</div>
    <div><b>3 round</b> combo sempre più lunghe e veloci. 3 errori e sei KO</div>
    <div><b>Finale</b> 10 secondi di fuoco: ogni colpo alza il moltiplicatore fino a x3</div></div>
    <button class="btn" id="go">Inizia il match</button><a class="back" href="/">&#8592; Torna al sito di Medusa Gym</a></div>`;
  $("go").onclick=()=>{thump(.01);trk("game_start");$("scr").innerHTML="";start()}}
function start(){reset();startRound()}
intro();
</script>
